<g fill="#244a36" font-size="22" font-weight="600"><text x="812" y="252">01  Integrity</text><text x="812" y="387">02  Readiness</text><text x="812" y="522">03  Performance</text></g><g fill="#586f49" font-size="14"><text x="812" y="287">228 pass / 12 fail</text><text x="812" y="422">107 / 155 trusted open ready</text><text x="812" y="557">66 trusted open overdue</text></g>
