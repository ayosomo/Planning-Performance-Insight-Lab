<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Planning and Performance Insight Lab architecture</title><desc id="desc">Two committed synthetic source feeds enter typed validation and preserved left joins. Independent integrity, readiness and performance rules feed the dashboard and review queue. Local source corrections revalidate the rules, and browser-local review histories export as JSON. Vercel hosts static assets only.</desc>
