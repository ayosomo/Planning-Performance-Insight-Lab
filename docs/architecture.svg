<text x="65" y="838" font-size="14" fill="#536d3d">Workbook comparison remains 208 PASS / 32 REVIEW. Refined indicators use independent definitions.</text><text x="65" y="867" font-size="13" fill="#536d3d">Actual on-time performance unavailable: no actual completion dates. Browser audit is illustrative, not authenticated or tamper-proof.</text>
