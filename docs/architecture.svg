<rect width="1400" height="900" fill="#f4f6ee"/>
<text x="65" y="67" font-family="Segoe UI,Arial" font-size="13" fill="#546d43" letter-spacing="3">PLANNING &amp; PERFORMANCE INSIGHT LAB</text>
<text x="65" y="122" font-family="Segoe UI,Arial" font-size="38" font-weight="600" fill="#1b4334">A transparent path from source to action.</text>
<text x="65" y="158" font-family="Segoe UI,Arial" font-size="17" fill="#566d48">Synthetic workbook extracts · Fixed snapshot: 23 October 2026 · No backend or employer connections</text>
