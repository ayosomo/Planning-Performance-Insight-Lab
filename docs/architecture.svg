<rect x="65" y="415" width="285" height="175" rx="12" fill="white" stroke="#cbd8bd"/><text x="88" y="449" font-size="12" letter-spacing="2" fill="#5a7547">COMMITTED INPUT</text><text x="88" y="486" font-size="23" font-weight="600" fill="#234936">Fictional supplier feed</text><text x="88" y="521" font-size="18" fill="#3c5a30">236 source rows</text><text x="88" y="555" font-size="13" fill="#596f4b">All matches and missing joins visible</text>
<path d="M350 303 H390 V403 H430 M350 503 H390 V403" fill="none" stroke="#60784d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="285" width="290" height="255" rx="12" fill="#214a39"/><text x="455" y="323" font-size="12" letter-spacing="2" fill="#d6e9ad">PURE TYPESCRIPT FUNCTIONS</text><text x="455" y="363" font-size="25" font-weight="600" fill="white">Join and validate</text><text x="455" y="404" font-size="16" fill="#e2edcf">Zod schemas + calendar checks</text><text x="455" y="437" font-size="16" fill="#e2edcf">Left join on exact order_id</text><text x="455" y="470" font-size="16" fill="#e2edcf">Preserve every CRM row</text><text x="455" y="503" font-size="16" fill="#e2edcf">No silent deduplication</text>
<path d="M720 403 H780" stroke="#60784d" stroke-width="2" marker-end="url(#arrow)"/>
